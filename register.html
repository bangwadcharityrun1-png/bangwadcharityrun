<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration • TOP100</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="inner"><a class="brand" href="index.html">TOP100 CHARITY RUN</a><select class="lang-select" data-lang-select><option value="th">🇹🇭 ไทย</option><option value="en">🇬🇧 English</option><option value="zh">🇨🇳 中文</option><option value="ru">🇷🇺 Русский</option></select></div></header><main class="container"><section class="panel"><div class="panel-head"><h1 data-i18n="form">ฟอร์มสมัคร</h1><p id="subtitle"></p></div><div class="panel-body"><div id="message"></div><form id="form" novalidate><section class="form-section"><h3 data-i18n="category">ประเภทการแข่งขัน</h3><div class="choice" id="categories"></div></section><section class="form-section"><h3 data-i18n="applicant">ข้อมูลผู้สมัคร</h3><div class="form-grid"><div class="field"><label data-i18n="docType">ประเภทเอกสาร</label><select id="documentType"><option value="thai_id" data-i18n="thaiId">บัตรประชาชนไทย</option><option value="passport" data-i18n="passport">Passport</option></select></div><div class="field"><label id="documentLabel" data-i18n="thaiId">บัตรประชาชนไทย</label><input id="documentNo" autocomplete="off" maxlength="13" inputmode="numeric" required><small class="muted" id="documentHint"></small></div><div class="field"><label data-i18n="first">ชื่อ</label><input id="firstName" required></div><div class="field"><label data-i18n="last">นามสกุล</label><input id="lastName" required></div><div class="field"><label data-i18n="dob">วันเกิด</label><input id="birthDate" type="date" required></div><div class="field"><label data-i18n="phone">เบอร์โทรศัพท์</label><input id="phone" type="tel" required></div><div class="field full"><label data-i18n="email">อีเมล</label><input id="email" type="email"></div></div><div id="dynamicFields" class="form-grid" style="margin-top:12px"></div></section><section class="form-section"><h3 data-i18n="slip">สลิปการชำระเงิน</h3><div class="upload"><input type="file" id="slip" accept="image/jpeg,image/png,image/webp" required><p class="muted" id="slipHelp"></p><button type="button" class="btn btn-dark" id="verify" data-i18n="verifySlip">ตรวจสอบสลิป</button></div><div id="slipStatus" style="margin-top:10px"></div></section><label class="check"><input type="checkbox" id="terms" required><span data-i18n="terms">ยืนยันว่าข้อมูลถูกต้องและยอมรับเงื่อนไข</span></label><button class="btn btn-primary" type="submit" style="width:100%;margin-top:14px" data-i18n="submit">ยืนยันการสมัคร</button></form></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/app.js"></script><script src="js/i18n.js"></script><script>
let eventData,cats=[],fields=[],selectedCategory=null,verificationToken=null;const el=s=>document.querySelector(s),msg=el('#message');
function thaiIdValid(v){v=String(v).replace(/\D/g,'');if(!/^\d{13}$/.test(v)||/^(\d)\1{12}$/.test(v))return false;let sum=0;for(let i=0;i<12;i++)sum+=Number(v[i])*(13-i);return(11-(sum%11))%10===Number(v[12])}
function passportValid(v){v=String(v).trim().toUpperCase();return /^[A-Z0-9]{6,12}$/.test(v)&&/[A-Z]/.test(v)&&/\d/.test(v)&&!(/^(.)\1+$/.test(v))}
function renderCategories(){el('#categories').innerHTML=cats.map(c=>`<button type="button" data-id="${c.id}" class="${selectedCategory===c.id?'active':''}">${APP.esc(APP.pick(c.name_i18n,I18N.lang)||c.code)}</button>`).join('');el('#categories').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.id;renderCategories()})}
function renderFields(){el('#dynamicFields').innerHTML=fields.map(f=>{const label=APP.esc(APP.pick(f.label_i18n,I18N.lang)||f.field_key),ph=APP.esc(APP.pick(f.placeholder_i18n,I18N.lang));if(f.input_type==='select'){const opts=(f.options_i18n||[]).map(o=>`<option value="${APP.esc(o.value)}">${APP.esc(APP.pick(o.label,I18N.lang)||o.value)}</option>`).join('');return `<div class="field ${f.full_width?'full':''}"><label>${label}${f.is_required?' *':''}</label><select data-dynamic="${f.field_key}" ${f.is_required?'required':''}><option value=""></option>${opts}</select></div>`}return `<div class="field ${f.full_width?'full':''}"><label>${label}${f.is_required?' *':''}</label><input data-dynamic="${f.field_key}" type="${f.input_type==='date'?'date':f.input_type==='email'?'email':'text'}" placeholder="${ph}" ${f.is_required?'required':''}></div>`}).join('')}
function setDocMode(){const pass=el('#documentType').value==='passport';el('#documentNo').value='';el('#documentNo').maxLength=pass?12:13;el('#documentNo').inputMode=pass?'text':'numeric';el('#documentLabel').textContent=pass?I18N.t('passport'):I18N.t('thaiId');el('#documentHint').textContent=''}
function validateDoc(){const pass=el('#documentType').value==='passport',v=el('#documentNo').value.trim().toUpperCase();const ok=pass?passportValid(v):thaiIdValid(v);el('#documentHint').textContent=ok?'✓':(pass?I18N.t('invalidPassport'):I18N.t('invalidThai'));el('#documentHint').style.color=ok?'#047857':'#b91c1c';return ok}
async function init(){try{eventData=await APP.getEvent();cats=await APP.getCategories(eventData.id);fields=await APP.getFields(eventData.id);el('#subtitle').textContent=APP.pick(eventData.form_intro_i18n,I18N.lang);el('#slipHelp').textContent=`${I18N.t('amount')} ${Number(eventData.registration_fee)} ${I18N.t('baht')}`;renderCategories();renderFields()}catch(e){msg.innerHTML=`<div class="error">${APP.esc(e.message)}</div>`}}
el('#documentType').onchange=setDocMode;el('#documentNo').oninput=validateDoc;window.addEventListener('languagechange',()=>{if(eventData){el('#subtitle').textContent=APP.pick(eventData.form_intro_i18n,I18N.lang);el('#slipHelp').textContent=`${I18N.t('amount')} ${Number(eventData.registration_fee)} ${I18N.t('baht')}`;renderCategories();renderFields();setDocMode()}});
el('#verify').onclick=async()=>{verificationToken=null;const file=el('#slip').files[0];if(!file){el('#slipStatus').innerHTML=`<div class="error">${I18N.t('slipRequired')}</div>`;return}el('#slipStatus').innerHTML=`<div class="notice">${I18N.t('checking')}</div>`;try{const fd=new FormData();fd.append('event_slug',APP.eventSlug);fd.append('slip',file);const {data,error}=await sb.functions.invoke('verify-slip',{body:fd});if(error)throw error;if(!data?.ok)throw new Error(data?.message||'Verification failed');verificationToken=data.verification_token;el('#slipStatus').innerHTML=`<div class="success">${I18N.t('verified')} • ${Number(data.amount)} ${I18N.t('baht')}</div>`}catch(e){el('#slipStatus').innerHTML=`<div class="error">${APP.esc(e.message)}</div>`}};
el('#form').onsubmit=async ev=>{ev.preventDefault();msg.innerHTML='';if(!selectedCategory||!validateDoc()||!el('#terms').checked){msg.innerHTML=`<div class="error">${I18N.t('required')}</div>`;return}if(!verificationToken){msg.innerHTML=`<div class="error">${I18N.t('slipRequired')}</div>`;return}const extra={};document.querySelectorAll('[data-dynamic]').forEach(x=>extra[x.dataset.dynamic]=x.value);const body={event_slug:APP.eventSlug,category_id:selectedCategory,document_type:el('#documentType').value,document_no:el('#documentNo').value.trim(),first_name:el('#firstName').value.trim(),last_name:el('#lastName').value.trim(),birth_date:el('#birthDate').value,phone:el('#phone').value.trim(),email:el('#email').value.trim(),accept_terms:true,verification_token:verificationToken,extra_data:extra,language:I18N.lang};msg.innerHTML=`<div class="notice">${I18N.t('waiting')}</div>`;try{const data=await APP.invoke('register-runner',body);if(!data?.ok)throw new Error(data?.message||'Register failed');location.href=`success.html?token=${encodeURIComponent(data.status_token)}`}catch(e){msg.innerHTML=`<div class="error">${APP.esc(e.message)}</div>`}};init();</script></body></html>
