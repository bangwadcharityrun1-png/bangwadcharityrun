function thaiIdValid(v){v=String(v).replace(/\D/g,'');if(!/^\d{13}$/.test(v)||/^(\d)\1{12}$/.test(v))return false;let sum=0;for(let i=0;i<12;i++)sum+=Number(v[i])*(13-i);return(11-(sum%11))%10===Number(v[12])}
function passportValid(v){v=String(v).trim().toUpperCase();return /^[A-Z0-9]{6,12}$/.test(v)&&/[A-Z]/.test(v)&&/\d/.test(v)&&!(/^(.)\1+$/.test(v))}

async function sha256Hex(file){
  const buf=await file.arrayBuffer();
  const hash=await crypto.subtle.digest('SHA-256',buf);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function validSlipFile(file){
  try{
    const head=new Uint8Array(await file.slice(0,8).arrayBuffer());
    const isJpeg=head.length>=3&&head[0]===0xFF&&head[1]===0xD8&&head[2]===0xFF;
    const isPng=head.length>=8&&head[0]===0x89&&head[1]===0x50&&head[2]===0x4E&&head[3]===0x47&&head[4]===0x0D&&head[5]===0x0A&&head[6]===0x1A&&head[7]===0x0A;
    return isJpeg||isPng;
  }catch(e){
    console.error('Cannot inspect slip file signature',e);
    return false;
  }
}
async function scanSlipQrInBrowser(file){
  if(typeof jsQR!=='function')throw new Error('ไม่สามารถโหลดตัวอ่าน QR ได้ กรุณารีเฟรชหน้าเว็บ');
  const bitmap=await createImageBitmap(file);
  try{
    if(bitmap.width<500||bitmap.height<500)throw new Error('รูปสลิปมีความละเอียดต่ำเกินไป');
    if(bitmap.width>9000||bitmap.height>9000)throw new Error('รูปภาพมีความละเอียดสูงเกินไป กรุณาใช้ภาพสลิปขนาดปกติ');

    const maxSide=1400;
    const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
    const w=Math.max(1,Math.round(bitmap.width*scale));
    const h=Math.max(1,Math.round(bitmap.height*scale));

    const canvas=document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    if(!ctx)throw new Error('เบราว์เซอร์ไม่สามารถอ่านรูปภาพได้');
    ctx.drawImage(bitmap,0,0,w,h);
    const image=ctx.getImageData(0,0,w,h);

    // สแกนปกติก่อน เพื่อลด CPU
    let qr=jsQR(image.data,w,h,{inversionAttempts:'dontInvert'});
    // ถ้ายังไม่เจอ ค่อยลองภาพกลับสีอีกครั้ง
    if(!qr)qr=jsQR(image.data,w,h,{inversionAttempts:'onlyInvert'});

    if(!qr?.data)throw new Error('ไม่พบ QR สำหรับตรวจสอบสลิป กรุณาใช้รูปสลิปธนาคารจริงที่เห็น QR ชัดเจน');
    return String(qr.data).trim();
  }finally{
    bitmap.close?.();
  }
}

function makeOcrVariant(source,mode='contrast'){
  const out=document.createElement('canvas');
  out.width=source.width;
  out.height=source.height;
  const ctx=out.getContext('2d',{willReadFrequently:true});
  if(!ctx)throw new Error('Cannot enhance image');

  ctx.drawImage(source,0,0);
  if(mode==='original')return out;

  const img=ctx.getImageData(0,0,out.width,out.height);
  const d=img.data;

  for(let i=0;i<d.length;i+=4){
    const gray=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);

    let value=gray;
    if(mode==='contrast'){
      // ดึงตัวเลขสีน้ำเงิน/เทาให้เข้ม และล้างพื้นหลังให้ขาว
      value=gray<215 ? Math.max(0,Math.round((gray-215)*1.8+215)) : 255;
    }else if(mode==='threshold'){
      value=gray<190?0:255;
    }else if(mode==='gray'){
      value=gray;
    }

    d[i]=d[i+1]=d[i+2]=value;
    d[i+3]=255;
  }

  ctx.putImageData(img,0,0);
  return out;
}

function cropCanvas(source,xRatio,yRatio,wRatio,hRatio,scale=2){
  const sx=Math.max(0,Math.round(source.width*xRatio));
  const sy=Math.max(0,Math.round(source.height*yRatio));
  const sw=Math.max(1,Math.min(source.width-sx,Math.round(source.width*wRatio)));
  const sh=Math.max(1,Math.min(source.height-sy,Math.round(source.height*hRatio)));

  const out=document.createElement('canvas');
  out.width=Math.max(1,sw*scale);
  out.height=Math.max(1,sh*scale);
  const ctx=out.getContext('2d',{willReadFrequently:true});
  if(!ctx)throw new Error('Cannot crop image');

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(source,sx,sy,sw,sh,0,0,out.width,out.height);
  return out;
}

async function makeOcrSources(file){
  const bitmap=await createImageBitmap(file);
  try{
    const maxSide=1900;
    const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
    const w=Math.max(1,Math.round(bitmap.width*scale));
    const h=Math.max(1,Math.round(bitmap.height*scale));

    const full=document.createElement('canvas');
    full.width=w;
    full.height=h;
    const ctx=full.getContext('2d',{willReadFrequently:true});
    if(!ctx)throw new Error('Cannot read image');
    ctx.drawImage(bitmap,0,0,w,h);

    // ใช้หลายโซนแบบทับซ้อนกัน เพราะแต่ละธนาคารวางยอดเงินคนละตำแหน่ง
    const upper=cropCanvas(full,.04,.10,.92,.34,2);
    const upperMid=cropCanvas(full,.04,.20,.92,.38,2);
    const middle=cropCanvas(full,.04,.30,.92,.38,2);
    const wide=cropCanvas(full,.02,.08,.96,.62,1.6);

    return [
      {name:'upper_contrast',focused:true,canvas:makeOcrVariant(upper,'contrast')},
      {name:'uppermid_contrast',focused:true,canvas:makeOcrVariant(upperMid,'contrast')},
      {name:'middle_contrast',focused:true,canvas:makeOcrVariant(middle,'contrast')},
      {name:'wide_threshold',focused:true,canvas:makeOcrVariant(wide,'threshold')},
      {name:'wide_gray',focused:true,canvas:makeOcrVariant(wide,'gray')},
      {name:'full_contrast',focused:false,canvas:makeOcrVariant(full,'contrast')},
      {name:'full_original',focused:false,canvas:makeOcrVariant(full,'original')}
    ];
  }finally{
    bitmap.close?.();
  }
}

function normalizeOcrText(text){
  return String(text||'')
    .replace(/[Oo]/g,'0')
    .replace(/[Il|]/g,'1')
    .replace(/[，]/g,',')
    .replace(/[。]/g,'.')
    .replace(/\s+/g,' ')
    .trim();
}

function amountEvidence(text,expected,{focused=false}={}){
  const clean=normalizeOcrText(text);
  const expectedNumber=Number(expected);
  const evidences=[];

  // รับทั้ง 200.00 และ 200,00
  const rx=/(?:^|[^\d])(\d{1,7})(?:[.,](\d{1,2}))?(?=$|[^\d])/g;
  for(const m of clean.matchAll(rx)){
    const integer=m[1];
    const decimals=m[2];
    const raw=decimals===undefined?integer:`${integer}.${decimals.padEnd(2,'0')}`;
    const value=Number(raw);
    if(!Number.isFinite(value)||value<0||value>1000000)continue;

    if(Math.abs(value-expectedNumber)<0.009){
      evidences.push({
        type:decimals!==undefined?'strong_decimal':'weak_integer',
        raw:m[0].trim(),
        value:expectedNumber
      });
    }

    // OCR บางครั้งทำจุดทศนิยมของ 200.00 หายเป็น 20000
    // อนุญาตเป็น "หลักฐานอ่อน" เฉพาะโซนที่เน้นยอดเงิน และต้องมีซ้ำจากอีก pass ก่อนจึงจะผ่าน
    if(focused && decimals===undefined && /^\d{3,8}$/.test(integer)){
      const cents=Number(integer)/100;
      if(Math.abs(cents-expectedNumber)<0.009){
        evidences.push({
          type:'weak_missing_decimal',
          raw:m[0].trim(),
          value:expectedNumber
        });
      }
    }
  }

  return evidences;
}

function collectMoneyCandidates(text){
  const clean=normalizeOcrText(text).replace(/,/g,'.');
  const out=[];
  const rx=/(?:^|[^\d])(\d{1,7}(?:\.\d{1,2})?)(?=$|[^\d])/g;
  for(const m of clean.matchAll(rx)){
    const n=Number(m[1]);
    if(Number.isFinite(n)&&n>=1&&n<=1000000)out.push(n);
  }
  return out;
}

function chooseLikelyWrongAmount(candidates,expected){
  const unique=[...new Set(candidates.map(Number).filter(Number.isFinite))];
  const plausible=unique
    .filter(v=>v>=1&&v<=100000)
    .filter(v=>Math.abs(v-Number(expected))>0.009)
    .sort((a,b)=>Math.abs(a-Number(expected))-Math.abs(b-Number(expected)));
  return plausible[0]??null;
}

async function readExpectedAmountFromSlip(file,expected){
  if(!window.Tesseract?.createWorker){
    throw new Error(localSlipText('ocrUnavailable'));
  }

  const sources=await makeOcrSources(file);
  let worker;
  const weakSources=new Set();
  const allCandidates=[];

  try{
    worker=await Tesseract.createWorker('eng');
    await worker.setParameters({
      tessedit_char_whitelist:'0123456789., ',
      preserve_interword_spaces:'1',
      tessedit_pageseg_mode:'11'
    });

    for(const source of sources){
      const result=await worker.recognize(source.canvas);
      const text=result?.data?.text||'';
      allCandidates.push(...collectMoneyCandidates(text));

      const evidence=amountEvidence(text,Number(expected),{focused:source.focused});

      // หลักฐานเข้ม: OCR เห็นยอดแบบมีทศนิยมตรง เช่น 200.00 / 200,00
      if(evidence.some(x=>x.type==='strong_decimal')){
        return {
          matched:true,
          detectedAmount:Number(expected),
          candidates:[...new Set(allCandidates)].slice(0,50),
          source:source.name,
          confidence:'strong'
        };
      }

      // หลักฐานอ่อน เช่น 200 หรือ 20000 ต้องพบจากอย่างน้อย 2 pass
      if(evidence.some(x=>x.type==='weak_integer'||x.type==='weak_missing_decimal')){
        weakSources.add(source.name);
        if(weakSources.size>=2){
          return {
            matched:true,
            detectedAmount:Number(expected),
            candidates:[...new Set(allCandidates)].slice(0,50),
            source:[...weakSources].join('+'),
            confidence:'confirmed_multi_pass'
          };
        }
      }
    }

    return {
      matched:false,
      detectedAmount:chooseLikelyWrongAmount(allCandidates,Number(expected)),
      candidates:[...new Set(allCandidates)].slice(0,60),
      source:'not_verified',
      confidence:'none'
    };
  }finally{
    if(worker)await worker.terminate();
  }
}

el('#verify').onclick=async()=>{
  if(isVerifying)return;

  verificationToken=null;
  const verifyBtn=el('#verify');
  const originalVerifyText=verifyBtn.textContent;
  const file=el('#slip').files[0];
  if(!file){
    el('#slipStatus').innerHTML=`<div class="error">${I18N.t('slipRequired')}</div>`;
    return;
  }

  if(!(await validSlipFile(file))){
    el('#slip').value='';
    el('#slipStatus').innerHTML='<div class="error">ไฟล์ไม่ใช่ภาพ JPG / JPEG / PNG ที่ถูกต้อง</div>';
    return;
  }

  if(file.size<15000||file.size>6*1024*1024){
    el('#slipStatus').innerHTML='<div class="error">ไฟล์สลิปต้องมีขนาด 15 KB ถึง 6 MB</div>';
    return;
  }

  const expectedAmount=Number(eventData?.registration_fee||0);
  if(!Number.isFinite(expectedAmount)||expectedAmount<=0){
    el('#slipStatus').innerHTML='<div class="error">ไม่พบค่าสมัครที่ถูกต้องในระบบ</div>';
    return;
  }

  isVerifying=true;
  verifyBtn.disabled=true;
  verifyBtn.setAttribute('aria-busy','true');
  verifyBtn.textContent=I18N.t('checking');

  Swal.fire({
    title:I18N.t('verifyLoadingTitle'),
    text:I18N.t('verifyLoadingHint'),
    allowOutsideClick:false,
    allowEscapeKey:false,
    showConfirmButton:false,
    didOpen:()=>Swal.showLoading()
  });

  try{
    el('#slipStatus').innerHTML=`<div class="notice">${I18N.t('checking')}</div>`;

    const [qrPayload,fileHash]=await Promise.all([
      scanSlipQrInBrowser(file),
      sha256Hex(file)
    ]);

    el('#slipStatus').innerHTML=`<div class="notice">${APP.esc(localSlipText('ocrLoading'))}</div>`;
    const amountResult=await readExpectedAmountFromSlip(file,expectedAmount);

    if(!amountResult.matched){
      const message=localSlipText('ocrMismatchUnknown',{expected:expectedAmount.toFixed(2)});
      Swal.close();
      el('#slipStatus').innerHTML=`<div class="error">${APP.esc(message)}</div>`;
      return;
    }

    const fd=new FormData();
    fd.append('event_slug',APP.eventSlug);
    fd.append('slip',file);
    fd.append('qr_payload',qrPayload);
    fd.append('file_sha256',fileHash);
    fd.append('detected_amount',String(amountResult.detectedAmount));

    const {data,error}=await sb.functions.invoke('verify-slip',{body:fd});
    if(error){
      let detail=error.message||'Verification failed';
      try{
        const response=error.context;
        if(response&&typeof response.clone==='function'){
          const payload=await response.clone().json();
          detail=payload?.message||payload?.error||detail;
        }
      }catch(_){}
      throw new Error(detail);
    }
    if(!data?.ok)throw new Error(data?.message||'Verification failed');

    verificationToken=data.verification_token;
    Swal.close();
    const ref=data.trans_ref?` • Ref: ${APP.esc(data.trans_ref)}`:'';
    const bank=data.sending_bank?` • Bank: ${APP.esc(data.sending_bank)}`:'';
    const amount=` • ${Number(data.screened_amount).toFixed(2)} THB`;
    const resumed=data.resumed===true
      ? `<br><strong>${APP.esc(I18N.lang==='th'?'พบสลิปที่เคยตรวจผ่านแล้ว สามารถใช้สมัครต่อได้':I18N.lang==='en'?'Previously screened slip found. You can continue registration.':I18N.lang==='zh'?'已找到之前通过检查的付款凭证，可以继续报名。':'Найден ранее проверенный чек. Можно продолжить регистрацию.')}</strong>`
      : '';
    el('#slipStatus').innerHTML=
      `<div class="success">${APP.esc(localSlipText('ocrMatched',{expected:expectedAmount.toFixed(2)}))}${bank}${ref}${amount}<br>${APP.esc(localSlipText('screened'))}${resumed}</div>`;
  }catch(e){
    Swal.close();
    el('#slipStatus').innerHTML=`<div class="error">${APP.esc(e.message)}</div>`;
  }finally{
    Swal.close();
    isVerifying=false;
    verifyBtn.disabled=false;
    verifyBtn.removeAttribute('aria-busy');
    verifyBtn.textContent=I18N.t('verifySlip');
  }
};
let isSubmitting=false;

el('#form').onsubmit=async ev=>{
  ev.preventDefault();

  if(isSubmitting)return;

  msg.innerHTML='';

  if(!selectedCategory||!validateDoc()||!el('#terms').checked){
    msg.innerHTML=`<div class="error">${I18N.t('required')}</div>`;
    return;
  }

  if(!verificationToken){
    msg.innerHTML=`<div class="error">${I18N.t('slipRequired')}</div>`;

    await Swal.fire({
      icon:'warning',
      title:I18N.t('slipVerifyWarningTitle'),
      text:I18N.t('slipVerifyWarningMessage'),
      confirmButtonText:I18N.t('slipVerifyWarningConfirm'),
      allowOutsideClick:false,
      allowEscapeKey:true
    });

    const slipSection=el('#slip')?.closest('.form-section');
    if(slipSection){
      slipSection.scrollIntoView({behavior:'smooth',block:'center'});
    }

    setTimeout(()=>{
      if(el('#slip')?.files?.length){
        el('#verify')?.focus();
      }else{
        el('#slip')?.focus();
      }
    },350);

    return;
  }

  const submitBtn=el('#submitRegistration');
  const originalSubmitText=submitBtn.textContent;

  const extra={};
  document.querySelectorAll('[data-dynamic]').forEach(x=>extra[x.dataset.dynamic]=x.value);

  const body={
    event_slug:APP.eventSlug,
    category_id:selectedCategory,
    document_type:el('#documentType').value,
    document_no:el('#documentNo').value.trim(),
    first_name:el('#firstName').value.trim(),
    last_name:el('#lastName').value.trim(),
    birth_date:el('#birthDate').value,
    phone:el('#phone').value.trim(),
    email:el('#email').value.trim(),
    accept_terms:true,
    verification_token:verificationToken,
    extra_data:extra,
    language:I18N.lang
  };

  isSubmitting=true;
  submitBtn.disabled=true;
  submitBtn.setAttribute('aria-busy','true');
  submitBtn.textContent=I18N.t('waiting');

  Swal.fire({
    title:I18N.t('savingTitle'),
    text:I18N.t('savingHint'),
    allowOutsideClick:false,
    allowEscapeKey:false,
    showConfirmButton:false,
    didOpen:()=>Swal.showLoading()
  });

  try{
    const data=await APP.invoke('register-runner',body);

    if(!data?.ok){
      throw new Error(data?.message||'Register failed');
    }

    await Swal.fire({
      icon:'success',
      title:I18N.t('approvalTitle'),
      html:`<div style="line-height:1.65">${APP.esc(I18N.t('approvalMessage'))}<br><small style="color:#64748b">${APP.esc(I18N.t('approvalHint'))}</small></div>`,
      confirmButtonText:I18N.t('ok'),
      allowOutsideClick:false,
      allowEscapeKey:false
    });

    location.href='success.html';
  }catch(e){
    Swal.close();
    msg.innerHTML=`<div class="error">${APP.esc(e.message)}</div>`;

    await Swal.fire({
      icon:'error',
      title:I18N.t('required'),
      text:e.message||'Register failed',
      confirmButtonText:I18N.t('ok')
    });

    isSubmitting=false;
    submitBtn.disabled=false;
    submitBtn.removeAttribute('aria-busy');
    submitBtn.textContent=originalSubmitText;
  }
};

init();</script></body></html>
