<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment • TOP100</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="inner"><a class="brand" href="index.html">TOP100 CHARITY RUN</a><select class="lang-select" data-lang-select><option value="th">🇹🇭 ไทย</option><option value="en">🇬🇧 English</option><option value="zh">🇨🇳 中文</option><option value="ru">🇷🇺 Русский</option></select></div></header><main class="container"><section class="panel"><div class="panel-head"><h1 data-i18n="payTitle">ชำระค่าสมัคร</h1><p data-i18n="payHelp">สแกน PromptPay QR Code แล้วบันทึกสลิปไว้</p></div><div class="panel-body"><div id="message"></div><div class="payment-layout"><div class="amount-box"><span data-i18n="amount">ยอดชำระ</span><strong id="amount">200</strong><span data-i18n="baht">บาท</span><p class="muted" id="accountName"></p></div><div><div class="qr-box"><div id="promptpayQr"></div></div></div></div><div class="notice" id="payNote"></div><button class="btn btn-primary" style="width:100%;margin-top:14px" id="continue" data-i18n="paid">ชำระเงินแล้ว • ไปกรอกใบสมัคร</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="config.js"></script><script src="js/app.js"></script><script src="js/i18n.js"></script><script src="js/promptpay.js"></script><script>
let e;async function init(){try{e=await APP.getEvent();document.querySelector('#amount').textContent=Number(e.registration_fee);document.querySelector('#accountName').textContent=e.promptpay_account_name||'';document.querySelector('#payNote').textContent=APP.pick(e.payment_note_i18n,I18N.lang);PromptPay.render(document.querySelector('#promptpayQr'),e.promptpay_id,e.registration_fee)}catch(err){document.querySelector('#message').innerHTML=`<div class="error">${APP.esc(err.message)}</div>`}}window.addEventListener('languagechange',()=>{if(e)document.querySelector('#payNote').textContent=APP.pick(e.payment_note_i18n,I18N.lang)});document.querySelector('#continue').onclick=()=>location.href='register.html';init();</script></body></html>
