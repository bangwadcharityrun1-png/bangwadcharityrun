<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Status • TOP100</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{overflow-x:hidden}
    .status-result{margin-top:16px}
    .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .status-item{border:1px solid #e5e7eb;border-radius:12px;padding:11px 12px;background:#fafafa;min-width:0;overflow-wrap:anywhere}
    .status-item strong{display:block;font-size:.76rem;color:#64748b;margin-bottom:4px}
    .status-badge{display:inline-flex;padding:7px 11px;border-radius:999px;font-weight:900;font-size:.82rem}
    .status-badge.pending{background:#fff7ed;color:#c2410c}
    .status-badge.approved{background:#dcfce7;color:#166534}
    .status-badge.rejected{background:#fee2e2;color:#b91c1c}
    .privacy-note{margin-top:14px;font-size:.8rem;color:#64748b;line-height:1.55}

    .runner-card{
      margin-top:16px;
      border:1px solid #e5e7eb;
      border-radius:22px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 14px 34px rgba(15,23,42,.08)
    }
    .runner-card-head{
      padding:18px;
      background:linear-gradient(135deg,#111827,#3b1765);
      color:#fff;
      text-align:center
    }
    .runner-card-head small{display:block;opacity:.78;font-weight:800;letter-spacing:.08em}
    .runner-card-head .bib-number{font-size:clamp(1.7rem,8vw,2.45rem);font-weight:1000;letter-spacing:.035em;margin-top:5px;overflow-wrap:anywhere}
    .runner-card-body{padding:18px}
    .runner-name{text-align:center;font-weight:950;font-size:1.15rem;margin-bottom:4px}
    .runner-category{text-align:center;color:#64748b;font-weight:850;font-size:.9rem}
    .bib-qr{
      width:min(260px,76vw);
      aspect-ratio:1;
      margin:18px auto 12px;
      padding:12px;
      background:#fff;
      border:1px solid #d8dde7;
      border-radius:18px;
      display:grid;
      place-items:center
    }
    .bib-qr img,.bib-qr svg{display:block;width:100%;height:100%;object-fit:contain}
    .qr-caption{text-align:center;color:#64748b;font-size:.8rem;line-height:1.5}
    .approved-note{margin-top:14px;background:#ecfdf5;border:1px solid #a7f3d0;color:#166534;border-radius:14px;padding:12px 14px;text-align:center;font-size:.86rem;font-weight:800;line-height:1.5}
    .save-card-btn{
      width:100%;
      border:0;
      background:#111827;
      color:#fff;
      border-radius:14px;
      min-height:50px;
      padding:13px 16px;
      margin-top:14px;
      font-weight:950;
      cursor:pointer
    }
    .share-card-btn{
      width:100%;
      border:1px solid #d8dde7;
      background:#fff;
      color:#111827;
      border-radius:14px;
      min-height:50px;
      padding:13px 16px;
      margin-top:9px;
      font-weight:950;
      cursor:pointer
    }
    .save-card-btn:disabled,.share-card-btn:disabled{opacity:.58;cursor:not-allowed}
    .save-hint{text-align:center;color:#64748b;font-size:.76rem;line-height:1.45;margin-top:8px}
    .capture-brand{font-size:.72rem;color:#94a3b8;text-align:center;margin-top:14px;font-weight:800;letter-spacing:.06em}
    .save-image-overlay{display:none;position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.94);padding:14px;overflow:auto;-webkit-overflow-scrolling:touch}
    .save-image-overlay.show{display:block}
    .save-image-dialog{width:min(560px,100%);margin:0 auto;background:#fff;border-radius:20px;padding:14px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .save-image-dialog h2{margin:4px 0 6px;text-align:center;font-size:1.08rem}
    .save-image-dialog p{margin:0 0 12px;text-align:center;color:#64748b;font-size:.86rem;line-height:1.55}
    .save-image-preview{display:block;width:100%;height:auto;background:#fff;border:1px solid #e5e7eb;border-radius:14px;-webkit-touch-callout:default;user-select:auto}
    .save-image-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
    .save-image-actions button,.save-image-actions a{min-height:48px;border-radius:13px;padding:12px 14px;text-align:center;font-weight:900;text-decoration:none;cursor:pointer}
    .save-image-close{border:1px solid #d8dde7;background:#fff;color:#111827}
    .save-image-external{border:0;background:#111827;color:#fff}
    .inapp-warning{margin-top:10px;padding:11px 12px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:.78rem;line-height:1.5;text-align:center}

    @media(max-width:560px){
      .container{padding-left:10px;padding-right:10px}
      .panel{margin-top:10px;border-radius:16px}
      .panel-head{padding:16px}
      .panel-body{padding:14px}
      .status-grid{grid-template-columns:1fr}
      .runner-card{border-radius:18px}
      .runner-card-body{padding:15px}
      .form-section{padding:14px}
      #document{font-size:16px}
    }

    @media print{
      header,.form-section,.privacy-note,.save-card-btn,.save-hint{display:none!important}
      body{background:#fff}
      .panel{border:0;box-shadow:none}
      .panel-head{display:none}
      .panel-body{padding:0}
      .runner-card{box-shadow:none;border:1px solid #ddd}
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="index.html">TOP100 CHARITY RUN</a>
    <select class="lang-select" id="lang">
      <option value="th">🇹🇭 ไทย</option>
      <option value="en">🇬🇧 English</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="ru">🇷🇺 Русский</option>
    </select>
  </div>
</header>

<main class="container">
  <section class="panel">
    <div class="panel-head">
      <div>
        <h1 id="pageTitle">ตรวจสถานะการสมัคร</h1>
        <p id="pageSubtitle">ค้นหาด้วยเลขบัตรประชาชนหรือ Passport ที่ใช้สมัคร</p>
      </div>
    </div>

    <div class="panel-body">
      <div class="form-section">
        <div class="field">
          <label id="docLabel" for="document">เลขบัตรประชาชน / Passport</label>
          <input id="document" autocomplete="off" placeholder="กรอกเลขที่ใช้สมัคร">
        </div>

        <button class="btn btn-primary" id="check" style="width:100%;margin-top:12px">
          ตรวจสถานะ
        </button>
      </div>

      <div id="result" class="status-result" aria-live="polite"></div>

      <div class="privacy-note" id="privacy">
        ระบบใช้เลขเอกสารเพื่อค้นหาแบบตรงตัวเท่านั้น และจะไม่แสดงเลขบัตรประชาชนหรือ Passport กลับบนหน้าจอ
      </div>
    </div>
  </section>
</main>

<div class="save-image-overlay" id="saveImageOverlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="save-image-dialog">
    <h2 id="saveImageTitle">บันทึกบัตรผู้เข้าแข่งขัน</h2>
    <p id="saveImageInstruction">กดค้างที่รูปด้านล่าง แล้วเลือก “บันทึกรูปภาพ”</p>
    <img id="saveImagePreview" class="save-image-preview" alt="Participant card">
    <div class="inapp-warning" id="saveImageWarning"></div>
    <div class="save-image-actions">
      <a class="save-image-external" id="openExternalBrowser" href="#" style="display:none">เปิดใน Safari / Chrome</a>
      <button class="save-image-close" id="closeSaveImage" type="button">ปิด</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/app.js"></script>

  let lang=localStorage.getItem('top100_lang')||'th';
  if(!t[lang])lang='th';

  const esc=v=>APP.esc(v==null?'':String(v));

  const ua=navigator.userAgent||'';
  const isLineInApp=/\bLine\//i.test(ua) || /\bLINE\b/i.test(ua);
  const isFacebookInApp=/FBAN|FBAV|FB_IAB|\[FB/i.test(ua);
  const isInstagramInApp=/Instagram/i.test(ua);
  const isSocialInApp=isLineInApp||isFacebookInApp||isInstagramInApp;

  function externalBrowserUrl(){
    try{
      const u=new URL(location.href);
      u.searchParams.set('openExternalBrowser','1');
      return u.toString();
    }catch{
      return location.href+(location.href.includes('?')?'&':'?')+'openExternalBrowser=1';
    }
  }

  function closeSaveImageOverlay(){
    const overlay=$('#saveImageOverlay');
    if(!overlay)return;
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
    $('#saveImagePreview')?.removeAttribute('src');
  }

  function showSaveImageOverlay(dataUrl){
    const overlay=$('#saveImageOverlay');
    const preview=$('#saveImagePreview');
    const external=$('#openExternalBrowser');
    if(!overlay||!preview)return;
    $('#saveImageTitle').textContent=t[lang].inAppSaveTitle;
    $('#saveImageInstruction').textContent=t[lang].inAppSaveInstruction;
    $('#saveImageWarning').textContent=t[lang].inAppSaveWarning;
    $('#closeSaveImage').textContent=t[lang].close;
    preview.src=dataUrl;
    if(external){
      external.textContent=t[lang].openExternal;
      if(isLineInApp){external.href=externalBrowserUrl();external.style.display='block';}
      else external.style.display='none';
    }
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden','false');
  }

  function applyLang(){
    document.documentElement.lang=lang;
    $('#lang').value=lang;
    $('#pageTitle').textContent=t[lang].title;
    $('#pageSubtitle').textContent=t[lang].subtitle;
    $('#docLabel').textContent=t[lang].doc;
    $('#document').placeholder=t[lang].placeholder;
    $('#check').textContent=t[lang].check;
    $('#privacy').textContent=t[lang].privacy;

    // ถ้าการ์ดผู้เข้าแข่งขันถูกแสดงอยู่แล้ว ให้เปลี่ยนภาษาทันที
    const saveBtn=$('#saveParticipantCard');
    const shareBtn=$('#shareParticipantCard');
    const saveHint=document.querySelector('.save-hint');
    const qrTitle=document.querySelector('.runner-card-head small');
    const qrCaption=document.querySelector('.qr-caption');
    const approvedNote=document.querySelector('.approved-note');
    const captureBrand=document.querySelector('.capture-brand');

    if(saveBtn && !saveBtn.disabled) saveBtn.textContent=t[lang].save;
    if(shareBtn && !shareBtn.disabled) shareBtn.textContent=t[lang].share;
    if(saveHint) saveHint.textContent=t[lang].saveHint;
    if(qrTitle) qrTitle.textContent=t[lang].qrTitle;
    if(qrCaption) qrCaption.textContent=t[lang].qrCaption;
    if(approvedNote) approvedNote.textContent=t[lang].approvedNote;
    if(captureBrand) captureBrand.textContent=t[lang].brand;
    if($('#saveImageOverlay')?.classList.contains('show')){
      $('#saveImageTitle').textContent=t[lang].inAppSaveTitle;
      $('#saveImageInstruction').textContent=t[lang].inAppSaveInstruction;
      $('#saveImageWarning').textContent=t[lang].inAppSaveWarning;
      $('#closeSaveImage').textContent=t[lang].close;
      const external=$('#openExternalBrowser'); if(external)external.textContent=t[lang].openExternal;
    }
    if(isSocialInApp && saveHint)saveHint.textContent=t[lang].inAppSaveInstruction;
  }

  function statusText(status){
    return {
      pending:t[lang].pending,
      approved:t[lang].approved,
      rejected:t[lang].rejected
    }[status]||status;

  function showError(message){
    $('#result').innerHTML=`<div class="error">${esc(message)}</div>`;
  }

  let currentRegistration=null;

  function validQrMatrix(matrix){
    return Array.isArray(matrix) && matrix.length>=21 && matrix.length<=177 &&
      matrix.every(row=>Array.isArray(row) && row.length===matrix.length && row.every(v=>v===0||v===1||v===true||v===false));
  }

  function qrSvgFromMatrix(matrix){
    if(!validQrMatrix(matrix))throw new Error('QR matrix unavailable');
    const size=matrix.length;
    const quiet=4;
    const total=size+(quiet*2);
    let path='';
    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        if(matrix[y][x])path+=`M${x+quiet} ${y+quiet}h1v1h-1z`;
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges" role="img" aria-label="BIB QR Code"><rect width="100%" height="100%" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
  }

  function roundRect(ctx,x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function fitText(ctx,text,maxWidth,startSize,minSize=24){
    let size=startSize;
    while(size>minSize){
      ctx.font=`900 ${size}px system-ui,-apple-system,Segoe UI,sans-serif`;
      if(ctx.measureText(text).width<=maxWidth)break;
      size-=2;
    }
    return size;
  }

  function drawQrMatrix(ctx,matrix,x,y,sizePx){
    if(!validQrMatrix(matrix))throw new Error('QR matrix unavailable');
    const quiet=4;
    const total=matrix.length+(quiet*2);
    const cell=sizePx/total;
    ctx.fillStyle='#fff';
    ctx.fillRect(x,y,sizePx,sizePx);
    ctx.fillStyle='#000';
    for(let row=0;row<matrix.length;row++){
      for(let col=0;col<matrix.length;col++){
        if(matrix[row][col]){
          const left=x+(col+quiet)*cell;
          const top=y+(row+quiet)*cell;
          ctx.fillRect(Math.floor(left),Math.floor(top),Math.ceil(cell)+0.25,Math.ceil(cell)+0.25);
        }
      }
    }
  }

  async function participantCardPng(bib){
    const r=currentRegistration;
    if(!r || !validQrMatrix(r.bib_qr_matrix))throw new Error('QR matrix unavailable');

    const canvas=document.createElement('canvas');
    canvas.width=1080;
    canvas.height=1500;
    const ctx=canvas.getContext('2d');
    if(!ctx)throw new Error('Canvas unavailable');

    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const grad=ctx.createLinearGradient(0,0,1080,360);
    grad.addColorStop(0,'#111827');
    grad.addColorStop(1,'#3b1765');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,1080,360);

    ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,.82)';
    ctx.font='800 30px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillText(t[lang].qrTitle,540,92);

    ctx.fillStyle='#fff';
    const bibSize=fitText(ctx,String(bib),900,84,52);
    ctx.font=`1000 ${bibSize}px system-ui,-apple-system,Segoe UI,sans-serif`;
    ctx.fillText(String(bib),540,205);

    const fullName=((r.first_name||'')+' '+(r.last_name||'')).trim();
    ctx.fillStyle='#111827';
    const nameSize=fitText(ctx,fullName,900,48,30);
    ctx.font=`900 ${nameSize}px system-ui,-apple-system,Segoe UI,sans-serif`;
    ctx.fillText(fullName,540,435);

    ctx.fillStyle='#64748b';
    ctx.font='800 32px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillText(r.category||'-',540,492);

    const qrSize=520;
    const qrX=(1080-qrSize)/2;
    const qrY=555;
    ctx.fillStyle='#fff';
    roundRect(ctx,qrX-20,qrY-20,qrSize+40,qrSize+40,32);
    ctx.fill();
    ctx.strokeStyle='#d8dde7';
    ctx.lineWidth=3;
    ctx.stroke();
    drawQrMatrix(ctx,r.bib_qr_matrix,qrX,qrY,qrSize);

    ctx.fillStyle='#64748b';
    ctx.font='600 25px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillText(t[lang].qrCaption,540,1140);

    const left=105;
    const right=975;
    ctx.textAlign='left';
    ctx.fillStyle='#64748b';
    ctx.font='700 24px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillText(t[lang].appNo, left, 1218);
    ctx.textAlign='right';
    ctx.fillStyle='#111827';
    ctx.font='900 27px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillText(r.application_no||'-', right, 1218);

    ctx.textAlign='left';
    ctx.fillStyle='#64748b';
    ctx.font='700 24px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillText(t[lang].bib, left, 1270);
    ctx.textAlign='right';
    ctx.fillStyle='#111827';
    ctx.font='900 27px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillText(String(bib), right, 1270);

    ctx.textAlign='center';
    ctx.fillStyle='#166534';
    roundRect(ctx,105,1320,870,82,22);
    ctx.fillStyle='#ecfdf5';
    ctx.fill();
    ctx.fillStyle='#166534';
    ctx.font='800 24px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillText(t[lang].approved,540,1371);

    ctx.fillStyle='#94a3b8';
    ctx.font='800 20px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillText(t[lang].brand,540,1455);

    const dataUrl=canvas.toDataURL('image/png',1);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png',1));
    if(!blob)throw new Error('PNG creation failed');

    const safeBib=String(bib).replace(/[^A-Za-z0-9_-]/g,'_');
    return {
      blob,
      dataUrl,
      safeBib,
      file:new File([blob],`${safeBib}.png`,{type:'image/png'})
    };
  }

  async function saveParticipantCard(bib){
    const btn=$('#saveParticipantCard');
    if(!btn)return;

    const originalText=btn.textContent;
    btn.disabled=true;
    btn.textContent=t[lang].saving;

    try{
      const {blob,dataUrl,safeBib}=await participantCardPng(bib);
      if(isSocialInApp){
        showSaveImageOverlay(dataUrl);
        return;
      }
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=`${safeBib}.png`;
      a.style.display='none';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
    }catch(e){
      console.error(e);
      alert(t[lang].saveFailed);
    }finally{
      btn.disabled=false;
      btn.textContent=t[lang].save;
    }
  }

  async function shareParticipantCard(bib){
    const btn=$('#shareParticipantCard');
    if(!btn)return;

    const originalText=btn.textContent;
    btn.disabled=true;
    btn.textContent=t[lang].sharing;

    try{
      const {file}=await participantCardPng(bib);

      if(!(navigator.share && navigator.canShare && navigator.canShare({files:[file]}))){
        alert(t[lang].shareUnavailable);
        return;
      }

      try{
        await navigator.share({
          files:[file],
          title:`TOP100 ${bib}`
        });
      }catch(err){
        if(err?.name!=='AbortError')throw err;
      }
    }catch(e){
      console.error(e);
      if(e?.name!=='AbortError')alert(t[lang].saveFailed);
    }finally{
      btn.disabled=false;
      btn.textContent=t[lang].share;
    }
  }

  async function renderApprovedCard(r){
    const bib=String(r.bib_number||'').trim();

    if(!bib){
      return `<div class="error" style="margin-top:12px">${esc(t[lang].noBib)}</div>`;
    }

    let qrSvg='';
    try{
      qrSvg=qrSvgFromMatrix(r.bib_qr_matrix);
    }catch(e){
      console.error(e);
      return `<div class="error" style="margin-top:12px">QR Code error</div>`;
    }

    return `
      <div class="runner-card" id="participantCard">
        <div class="runner-card-head">
          <small>${esc(t[lang].qrTitle)}</small>
          <div class="bib-number">${esc(bib)}</div>
        </div>

        <div class="runner-card-body">
          <div class="runner-name">${esc((r.first_name||'')+' '+(r.last_name||''))}</div>
          <div class="runner-category">${esc(r.category||'-')}</div>

          <div class="bib-qr">
            ${qrSvg}
          </div>

          <div class="qr-caption">${esc(t[lang].qrCaption)}</div>

          <div class="status-grid" style="margin-top:16px">
            <div class="status-item">
              <strong>${esc(t[lang].appNo)}</strong>
              ${esc(r.application_no||'-')}
            </div>
            <div class="status-item">
              <strong>${esc(t[lang].bib)}</strong>
              ${esc(bib)}
            </div>
            <div class="status-item">
              <strong>${esc(t[lang].name)}</strong>
              ${esc((r.first_name||'')+' '+(r.last_name||''))}
            </div>
            <div class="status-item">
              <strong>${esc(t[lang].category)}</strong>
              ${esc(r.category||'-')}
            </div>
          </div>

          <div class="approved-note">${esc(t[lang].approvedNote)}</div>
          <div class="capture-brand">${esc(t[lang].brand)}</div>
        </div>
      </div>

      <button class="save-card-btn" id="saveParticipantCard" type="button">
        ${esc(t[lang].save)}
      </button>
      <button class="share-card-btn" id="shareParticipantCard" type="button">
        ${esc(t[lang].share)}
      </button>
      <div class="save-hint">${esc(isSocialInApp?t[lang].inAppSaveInstruction:t[lang].saveHint)}</div>
    `;
  }

  async function checkStatus(){
    const documentNo=$('#document').value.trim();

    if(!documentNo){
      showError(t[lang].invalid);
      return;
    }

    $('#check').disabled=true;
    $('#result').innerHTML=`<div class="notice">${esc(t[lang].checking)}</div>`;

    try{
      const data=await APP.invoke('check-registration',{
        event_slug:APP.eventSlug,
        document_no:documentNo
      });

      if(!data?.ok)throw new Error(data?.message||t[lang].invalid);

      if(!data.found){
        currentRegistration=null;
        $('#result').innerHTML=`<div class="notice">${esc(t[lang].notFound)}</div>`;
        return;
      }

      const r=data.registration||{};

      const base=`
        <div class="card">
          <div class="status-grid">
            <div class="status-item">
              <strong>${esc(t[lang].appNo)}</strong>
              ${esc(r.application_no||'-')}
            </div>
            <div class="status-item">
              <strong>${esc(t[lang].bib)}</strong>
              ${esc(r.bib_number||'-')}
            </div>
            <div class="status-item">
              <strong>${esc(t[lang].name)}</strong>
              ${esc((r.first_name||'')+' '+(r.last_name||''))}
            </div>
            <div class="status-item">
              <strong>${esc(t[lang].category)}</strong>
              ${esc(r.category||'-')}
            </div>
            <div class="status-item">
              <strong>${esc(t[lang].status)}</strong>
              <span class="status-badge ${esc(r.status||'')}">${esc(statusText(r.status))}</span>
            </div>
          </div>

          ${r.status==='rejected'&&r.reject_reason
            ? `<div class="error" style="margin-top:12px"><strong>${esc(t[lang].reason)}:</strong> ${esc(r.reject_reason)}</div>`
            : ''}
        </div>`;

      if(r.status==='approved'){
        currentRegistration=r;
        const approvedCard=await renderApprovedCard(r);
        $('#result').innerHTML=base+approvedCard;
        $('#saveParticipantCard')?.addEventListener('click',()=>saveParticipantCard(r.bib_number));
        $('#shareParticipantCard')?.addEventListener('click',()=>shareParticipantCard(r.bib_number));
      }else{
        currentRegistration=null;
        $('#result').innerHTML=base;
      }
    }catch(e){
      currentRegistration=null;
      showError(e.message||t[lang].invalid);
    }finally{
      $('#check').disabled=false;
    }
  }

  $('#closeSaveImage')?.addEventListener('click',closeSaveImageOverlay);
  $('#saveImageOverlay')?.addEventListener('click',e=>{if(e.target===e.currentTarget)closeSaveImageOverlay();});

  $('#lang').addEventListener('change',e=>{
    lang=e.target.value;
    localStorage.setItem('top100_lang',lang);
    applyLang();
  });

  $('#check').addEventListener('click',checkStatus);
  $('#document').addEventListener('keydown',e=>{
    if(e.key==='Enter')checkStatus();
  });

  applyLang();
})();
</script>
</body>
</html>
