<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status • TOP100</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="inner"><a class="brand" href="index.html">TOP100 CHARITY RUN</a><select class="lang-select" data-lang-select><option value="th">🇹🇭 ไทย</option><option value="en">🇬🇧 English</option><option value="zh">🇨🇳 中文</option><option value="ru">🇷🇺 Русский</option></select></div></header><main class="container"><section class="panel"><div class="panel-head"><h1 data-i18n="status">ตรวจสอบสถานะ</h1></div><div class="panel-body"><div class="form-section"><div class="field"><label>Status token</label><input id="token"></div><button class="btn btn-primary" id="check" style="width:100%;margin-top:12px">Check</button></div><div id="result"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/app.js"></script><script src="js/i18n.js"></script><script>document.querySelector('#token').value=new URLSearchParams(location.search).get('token')||'';document.querySelector('#check').onclick=async()=>{const token=document.querySelector('#token').value.trim();try{const data=await APP.invoke('registration-status',{token});document.querySelector('#result').innerHTML=`<div class="card"><strong>${APP.esc(data.application_no||'')}</strong><p>Status: ${APP.esc(data.status||'')}</p><p>BIB: ${APP.esc(data.bib_number||'-')}</p></div>`}catch(e){document.querySelector('#result').innerHTML=`<div class="error">${APP.esc(e.message)}</div>`}}</script></body></html>
