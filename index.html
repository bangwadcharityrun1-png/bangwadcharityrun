<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOP100 Charity Run</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="inner"><div class="brand"><img id="siteLogo" alt="TOP100 Logo" style="display:none;width:42px;height:42px;object-fit:contain;border-radius:10px"><span id="brandText">TOP100 CHARITY RUN</span></div><div class="nav-actions"><a href="status.html" data-i18n="status">ตรวจสอบสถานะ</a><select class="lang-select" data-lang-select><option value="th">🇹🇭 ไทย</option><option value="en">🇬🇧 English</option><option value="zh">🇨🇳 中文</option><option value="ru">🇷🇺 Русский</option></select></div></div></header>
<main class="container"><div id="message"></div><section class="hero" id="hero"><div><div class="status-open" id="statusBadge" data-i18n="open">เปิดรับสมัคร</div><h1 id="heroTitle">TOP100<br>CHARITY RUN</h1><p id="heroText"></p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-light" id="applyTop" data-i18n="apply">สมัคร</button><a class="btn btn-light" href="status.html" data-i18n="status">ตรวจสอบสถานะ</a></div></div><div class="hero-metrics"><div class="metric"><strong id="feeMetric">200 ฿</strong><span data-i18n="fee">ค่าสมัคร</span></div><div class="metric"><strong>∞</strong><span data-i18n="unlimited">ไม่จำกัดจำนวน</span></div><div class="metric"><strong>MEN</strong><span>TOP100MEN</span></div><div class="metric"><strong>WOMEN</strong><span>TOP100WOMEN</span></div></div></section>
<div class="section-title"><div><h2 data-i18n="choose">เลือกประเภทการแข่งขัน</h2><p id="categoryHelp"></p></div><strong id="feeTag"></strong></div><section class="grid2" id="categories"></section>
<div class="card sticky-cta"><div><strong id="ctaTitle"></strong><div class="muted" id="ctaText"></div></div><button class="btn btn-primary" id="applyBottom" data-i18n="apply">สมัคร</button></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/app.js"></script><script src="js/i18n.js"></script><script>
let eventData,cats=[]; const msg=document.querySelector('#message');
function renderLang(){if(!eventData)return;const l=I18N.lang;document.querySelector('#heroTitle').textContent=APP.pick(eventData.hero_title_i18n,l)||eventData.event_name;document.querySelector('#heroText').textContent=APP.pick(eventData.hero_subtitle_i18n,l);document.querySelector('#categoryHelp').textContent=APP.pick(eventData.category_intro_i18n,l);document.querySelector('#ctaTitle').textContent=APP.pick(eventData.cta_title_i18n,l);document.querySelector('#ctaText').textContent=APP.pick(eventData.cta_text_i18n,l);document.querySelector('#feeMetric').textContent=`${Number(eventData.registration_fee)} ฿`;document.querySelector('#feeTag').textContent=`${I18N.t('fee')} ${Number(eventData.registration_fee)} ${I18N.t('baht')}`;document.querySelector('#brandText').textContent=eventData.event_name||'TOP100 CHARITY RUN';const logo=document.querySelector('#siteLogo');if(eventData.logo_url){logo.src=eventData.logo_url;logo.style.display='block'}else{logo.removeAttribute('src');logo.style.display='none'}const hero=document.querySelector('#hero');if(eventData.banner_url){hero.style.backgroundImage=`linear-gradient(90deg,rgba(15,23,42,.92),rgba(49,18,85,.72)),url("${String(eventData.banner_url).replaceAll('"','%22')}")`;hero.style.backgroundSize='cover';hero.style.backgroundPosition='center'}else{hero.style.backgroundImage=''}document.querySelector('#categories').innerHTML=cats.map(c=>`<article class="card category-card"><div class="category-copy"><small>${APP.esc(c.code)}</small><h3>${APP.esc(APP.pick(c.name_i18n,l)||c.code)}</h3><p>${APP.esc(APP.pick(c.description_i18n,l))}</p></div><div class="category-img">${c.shirt_image_url?`<img src="${APP.esc(c.shirt_image_url)}" alt="${APP.esc(c.code)}">`:`<div class="shirt-placeholder">100</div>`}</div></article>`).join('');}
async function init(){try{eventData=await APP.getEvent();cats=await APP.getCategories(eventData.id);if(eventData.status!=='open'){document.querySelector('#statusBadge').textContent=I18N.t('closed');document.querySelectorAll('#applyTop,#applyBottom').forEach(b=>b.disabled=true)}renderLang()}catch(e){msg.innerHTML=`<div class="error">${APP.esc(e.message)}</div>`}}window.addEventListener('languagechange',renderLang);document.querySelectorAll('#applyTop,#applyBottom').forEach(b=>b.onclick=()=>location.href='payment.html');init();</script></body></html>
