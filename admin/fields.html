<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><title>TOP100 Admin</title></head><body><header class="topbar"><div class="inner"><div class="brand">TOP100 ADMIN</div><div class="nav-actions"><a href="../index.html" target="_blank">ดูเว็บไซต์</a><button class="btn btn-light" id="logout">ออกจากระบบ</button></div></div></header><main class="container"><div class="admin-layout"><aside class="sidebar"><a href="index.html">Dashboard</a><a href="event.html">ตั้งค่างาน/หน้าเว็บ</a><a href="categories.html">ประเภทและรูปเสื้อ</a><a href="fields.html">ฟอร์มสมัคร</a><a href="payment.html">PromptPay/ตรวจสลิป</a><a href="applicants.html">ผู้สมัคร</a></aside><section class="admin-main"><div class="admin-head"><div><h1>ฟอร์มรับสมัคร</h1><p class="muted">เพิ่ม/แก้ไข/ลบฟิลด์เพิ่มเติม โดยไม่ต้องแก้ฐานข้อมูล</p></div><button class="btn btn-dark" id="add">+ เพิ่มฟิลด์</button></div><div id="adminMsg"></div><div id="list"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../js/app.js"></script><script src="js/admin.js"></script><script>(async()=>{if(!await ADMIN.guard())return;const e=await ADMIN.event();async function load(){const {data,error}=await sb.from('registration_fields').select('*').eq('event_id',e.id).order('display_order');if(error)return ADMIN.toast(error.message,'error');document.querySelector('#list').innerHTML=data.map(f=>`<div class="card" style="margin-bottom:10px"><div class="form-grid"><div class="field"><label>Field key</label><input data-key="${f.id}" value="${APP.esc(f.field_key)}"></div><div class="field"><label>ประเภท</label><select data-type="${f.id}"><option ${f.input_type==='text'?'selected':''}>text</option><option ${f.input_type==='date'?'selected':''}>date</option><option ${f.input_type==='email'?'selected':''}>email</option><option ${f.input_type==='select'?'selected':''}>select</option></select></div><div class="field"><label>ชื่อไทย</label><input data-label="${f.id}" value="${APP.esc((f.label_i18n||{}).th||'')}"></div><div class="field"><label>ลำดับ</label><input data-order="${f.id}" type="number" value="${f.display_order}"></div></div><label class="check" style="margin-top:10px"><input data-required="${f.id}" type="checkbox" ${f.is_required?'checked':''}>บังคับกรอก</label><label class="check"><input data-active="${f.id}" type="checkbox" ${f.is_active?'checked':''}>เปิดใช้งาน</label><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-dark" data-save="${f.id}">บันทึก</button><button class="btn btn-danger" data-del="${f.id}">ลบ</button></div></div>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,old=data.find(x=>x.id===id);const labels={...(old.label_i18n||{}),th:document.querySelector(`[data-label="${id}"]`).value};const {error}=await sb.from('registration_fields').update({field_key:document.querySelector(`[data-key="${id}"]`).value,input_type:document.querySelector(`[data-type="${id}"]`).value,label_i18n:labels,display_order:Number(document.querySelector(`[data-order="${id}"]`).value),is_required:document.querySelector(`[data-required="${id}"]`).checked,is_active:document.querySelector(`[data-active="${id}"]`).checked}).eq('id',id);if(error)ADMIN.toast(error.message,'error');else ADMIN.toast('บันทึกแล้ว')});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('ลบฟิลด์?'))return;const {error}=await sb.from('registration_fields').delete().eq('id',b.dataset.del);if(error)ADMIN.toast(error.message,'error');else load()})}document.querySelector('#add').onclick=async()=>{const key=prompt('Field key เช่น team_name');if(!key)return;const {error}=await sb.from('registration_fields').insert({event_id:e.id,field_key:key,input_type:'text',label_i18n:{th:key,en:key,zh:key,ru:key},display_order:99});if(error)ADMIN.toast(error.message,'error');else load()};load()})();</script></body></html>
