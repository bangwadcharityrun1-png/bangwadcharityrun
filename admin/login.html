
<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .login-note{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f5f3ff;border:1px solid #ddd6fe;color:#5b21b6;font-size:.86rem;line-height:1.5}
    .login-link{text-align:center;margin-top:14px}
    .login-link a{color:#6d28d9;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main class="container">
    <section class="panel">
      <div class="panel-head">
        <h1>Admin Login</h1>
        <p>TOP100 Charity Run</p>
      </div>
      <div class="panel-body">
        <div id="msg"></div>
        <form id="login">
          <div class="field">
            <label>Email</label>
            <input id="email" type="email" required autocomplete="email">
          </div>
          <div class="field" style="margin-top:10px">
            <label>Password</label>
            <input id="password" type="password" required autocomplete="current-password">
          </div>
          <button id="login-btn" class="btn btn-primary" style="width:100%;margin-top:14px" type="submit">เข้าสู่ระบบ</button>
        </form>

        <div class="login-note">
          หากนี่คือบัญชีแรกที่สร้างจากหน้า Setup และเพิ่งยืนยัน Email ระบบจะเปิดสิทธิ์ Superadmin ให้โดยอัตโนมัติเมื่อ Login ครั้งแรก
        </div>

        <p class="login-link"><a href="setup.html">ตั้งค่า Admin ครั้งแรก</a></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const form=document.querySelector('#login');
    const msg=document.querySelector('#msg');
    const btn=document.querySelector('#login-btn');

    function showMessage(text,type='error'){
      msg.innerHTML=`<div class="${type}">${APP.esc(text)}</div>`;
    }

    async function getAdminProfile(userId){
      const {data,error}=await sb
        .from('admin_profiles')
        .select('*')
        .eq('user_id',userId)
        .eq('is_active',true)
        .maybeSingle();

      if(error) throw error;
      return data;
    }

    async function ensureFirstAdmin(session){
      // บัญชีนี้เป็น Admin อยู่แล้ว
      let profile=await getAdminProfile(session.user.id);
      if(profile) return profile;

      // ตรวจว่าระบบมี Admin คนแรกแล้วหรือยัง
      const {data:status,error:statusError}=await sb.rpc('admin_setup_status');
      if(statusError){
        throw new Error('ยังไม่ได้ติดตั้งระบบ Admin Setup ในฐานข้อมูล: '+statusError.message);
      }

      const initialized=Boolean(status?.initialized);

      // ถ้ายังไม่มี Admin เลย บัญชีที่ยืนยันอีเมลและ Login สำเร็จนี้
      // คือบัญชีจากขั้นตอน Setup คนแรก ให้สร้าง Superadmin ให้ทันที
      if(!initialized){
        const displayName=
          session.user.user_metadata?.display_name ||
          session.user.email?.split('@')[0] ||
          'Super Admin';

        const {error:bootstrapError}=await sb.rpc('bootstrap_first_admin',{
          p_display_name:displayName
        });

        if(bootstrapError){
          throw new Error('ไม่สามารถเปิดสิทธิ์ Superadmin คนแรกได้: '+bootstrapError.message);
        }

        profile=await getAdminProfile(session.user.id);
        if(profile) return profile;
      }

      // มี Admin อยู่แล้ว แต่บัญชีนี้ไม่มี profile = ไม่มีสิทธิ์
      return null;
    }

    form.addEventListener('submit',async e=>{
      e.preventDefault();
      msg.innerHTML='';
      btn.disabled=true;
      btn.textContent='กำลังเข้าสู่ระบบ...';

      try{
        const email=document.querySelector('#email').value.trim();
        const password=document.querySelector('#password').value;

        const {data,error}=await sb.auth.signInWithPassword({email,password});
        if(error) throw error;

        if(!data?.session){
          throw new Error('ไม่พบ Session หลัง Login');
        }

        const profile=await ensureFirstAdmin(data.session);

        if(!profile){
          await sb.auth.signOut();
          showMessage('บัญชีนี้ Login ได้ แต่ไม่มีสิทธิ์ Admin กรุณาใช้บัญชี Superadmin/Admin ที่ได้รับอนุญาต');
          return;
        }

        showMessage('เข้าสู่ระบบสำเร็จ','success');
        location.replace('index.html');
      }catch(err){
        showMessage(err.message||String(err));
      }finally{
        btn.disabled=false;
        btn.textContent='เข้าสู่ระบบ';
      }
    });

    (async()=>{
      const params=new URLSearchParams(location.search);
      if(params.get('error')==='no_admin'){
        showMessage('บัญชีนี้ไม่มีสิทธิ์ Admin');
      }else if(params.get('error')==='profile'){
        showMessage('ไม่สามารถตรวจสอบสิทธิ์ Admin ได้ กรุณาตรวจสอบฐานข้อมูล/RLS');
      }

      // ถ้ามี session อยู่แล้วและมีสิทธิ์ Admin ไม่ต้อง Login ซ้ำ
      try{
        const {data:{session}}=await sb.auth.getSession();
        if(!session) return;

        const profile=await ensureFirstAdmin(session);
        if(profile){
          location.replace('index.html');
        }
      }catch(err){
        console.warn(err);
      }
    })();
  </script>
</body>
</html>
