<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="../styles.css"></head><body><main class="container"><section class="panel"><div class="panel-head"><h1>Admin Login</h1><p>TOP100 Charity Run</p></div><div class="panel-body"><div id="msg"></div><form id="login"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field" style="margin-top:10px"><label>Password</label><input id="password" type="password" required></div><button class="btn btn-primary" style="width:100%;margin-top:14px">เข้าสู่ระบบ</button></form></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../js/app.js"></script><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(error){document.querySelector('#msg').innerHTML=`<div class="error">${error.message}</div>`;return}location.href='index.html'}</script></body></html>
