<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><title>TOP100 Admin</title></head><body><header class="topbar"><div class="inner"><div class="brand">TOP100 ADMIN</div><div class="nav-actions"><a href="../index.html" target="_blank">ดูเว็บไซต์</a><button class="btn btn-light" id="logout">ออกจากระบบ</button></div></div></header><main class="container"><div class="admin-layout"><aside class="sidebar"><a href="index.html">Dashboard</a><a href="event.html">ตั้งค่างาน/หน้าเว็บ</a><a href="categories.html">ประเภทและรูปเสื้อ</a><a href="fields.html">ฟอร์มสมัคร</a><a href="payment.html">PromptPay/ตรวจสลิป</a><a href="applicants.html">ผู้สมัคร</a></aside><section class="admin-main"><div class="admin-head"><div><h1>PromptPay และตรวจสลิป</h1><p class="muted">QR จะสร้างจากเลข PromptPay โดยอัตโนมัติ</p></div><button class="btn btn-dark" id="save">บันทึก</button></div><div id="adminMsg"></div><div class="card"><div class="form-grid"><div class="field"><label>PromptPay ID</label><input id="promptpay"></div><div class="field"><label>ชื่อบัญชีผู้รับ</label><input id="accountName"></div><div class="field"><label>ผู้ให้บริการตรวจสลิป</label><select id="provider"><option value="slipok">SlipOK</option><option value="manual">Manual</option></select></div><div class="field"><label>SlipOK Branch ID</label><input id="branch"></div><div class="field full"><label>SlipOK API Key</label><input id="apiKey" type="password" placeholder="กรอกเฉพาะเมื่อต้องการตั้ง/เปลี่ยน API Key"></div></div><div class="notice" style="margin-top:12px">API Key จะส่งไปเก็บผ่าน Edge Function ฝั่งเซิร์ฟเวอร์ ไม่บันทึกไว้ใน JavaScript หน้าเว็บ</div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../js/app.js"></script><script src="js/admin.js"></script><script>(async()=>{if(!await ADMIN.guard())return;const e=await ADMIN.event();document.querySelector('#promptpay').value=e.promptpay_id||'';document.querySelector('#accountName').value=e.promptpay_account_name||'';const {data:pi}=await sb.from('payment_integrations').select('*').eq('event_id',e.id).maybeSingle();if(pi){document.querySelector('#provider').value=pi.provider;document.querySelector('#branch').value=pi.branch_id||''}document.querySelector('#save').onclick=async()=>{let {error}=await sb.from('events').update({promptpay_id:document.querySelector('#promptpay').value.trim(),promptpay_account_name:document.querySelector('#accountName').value.trim()}).eq('id',e.id);if(error)return ADMIN.toast(error.message,'error');const body={event_id:e.id,provider:document.querySelector('#provider').value,branch_id:document.querySelector('#branch').value.trim(),api_key:document.querySelector('#apiKey').value.trim()};const {data,error:fnError}=await sb.functions.invoke('admin-integration-secret',{body});if(fnError)return ADMIN.toast(fnError.message,'error');if(!data?.ok)return ADMIN.toast(data?.message||'บันทึกไม่สำเร็จ','error');document.querySelector('#apiKey').value='';ADMIN.toast('บันทึกแล้ว')};})();</script></body></html>
