<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><title>TOP100 Admin</title></head><body><header class="topbar"><div class="inner"><div class="brand">TOP100 ADMIN</div><div class="nav-actions"><a href="../index.html" target="_blank">ดูเว็บไซต์</a><button class="btn btn-light" id="logout">ออกจากระบบ</button></div></div></header><main class="container"><div class="admin-layout"><aside class="sidebar"><a href="index.html">Dashboard</a><a href="event.html">ตั้งค่างาน/หน้าเว็บ</a><a href="categories.html">ประเภทและรูปเสื้อ</a><a href="fields.html">ฟอร์มสมัคร</a><a href="payment.html">PromptPay/ตรวจสลิป</a><a href="applicants.html">ผู้สมัคร</a></aside><section class="admin-main"><div class="admin-head"><div><h1>ผู้สมัคร</h1><p class="muted">ค้นหา ตรวจสอบ และจัดการสถานะ</p></div></div><div id="adminMsg"></div><div class="card"><div class="field"><label>ค้นหา</label><input id="q" placeholder="เลขใบสมัคร / ชื่อ / เอกสาร / โทร"></div></div><div class="card" style="margin-top:12px"><div class="table-wrap"><table class="table"><thead><tr><th>ใบสมัคร</th><th>ชื่อ</th><th>ประเภท</th><th>Payment</th><th>Bank / Ref</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../js/app.js"></script><script src="js/admin.js"></script><script>(async()=>{if(!await ADMIN.guard())return;const e=await ADMIN.event();let all=[];async function load(){const {data,error}=await sb.from('registrations').select('id,application_no,first_name,last_name,document_no,phone,status,event_categories(code),payments(status,amount,trans_ref,sending_bank,slip_path,verification_response)').eq('event_id',e.id).order('created_at',{ascending:false});if(error)return ADMIN.toast(error.message,'error');all=data;render()}function render(){const q=document.querySelector('#q').value.trim().toLowerCase();const d=all.filter(r=>!q||[r.application_no,r.first_name,r.last_name,r.document_no,r.phone].join(' ').toLowerCase().includes(q));document.querySelector('#rows').innerHTML=d.map(r=>`<tr><td>${APP.esc(r.application_no)}</td><td>${APP.esc(r.first_name+' '+r.last_name)}</td><td>${APP.esc(r.event_categories?.code||'')}</td><td><span class="pill ${r.payments?.status}">${APP.esc(r.payments?.status||'-')}</span></td><td>${APP.esc((r.payments?.sending_bank||'-')+' / '+(r.payments?.trans_ref||'-'))}</td><td><span class="pill ${r.status}">${r.status}</span></td><td><button class="btn btn-light" data-slip="${APP.esc(r.payments?.slip_path||'')}">ดูสลิป</button> <button class="btn btn-dark" data-approve="${r.id}">อนุมัติ</button></td></tr>`).join('');document.querySelectorAll('[data-slip]').forEach(b=>b.onclick=async()=>{const path=b.dataset.slip;if(!path)return;const {data,error}=await sb.storage.from('registration-slips').createSignedUrl(path,120);if(error)return ADMIN.toast(error.message,'error');window.open(data.signedUrl,'_blank','noopener')});document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('registrations').update({status:'approved',approved_at:new Date().toISOString()}).eq('id',b.dataset.approve);if(error)ADMIN.toast(error.message,'error');else load()})}document.querySelector('#q').oninput=render;load()})();</script></body></html>
