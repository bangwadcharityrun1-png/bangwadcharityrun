<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><title>TOP100 Admin</title></head><body><header class="topbar"><div class="inner"><div class="brand">TOP100 ADMIN</div><div class="nav-actions"><a href="../index.html" target="_blank">ดูเว็บไซต์</a><button class="btn btn-light" id="logout">ออกจากระบบ</button></div></div></header><main class="container"><div class="admin-layout"><aside class="sidebar"><a href="index.html">Dashboard</a><a href="event.html">ตั้งค่างาน/หน้าเว็บ</a><a href="categories.html">ประเภทและรูปเสื้อ</a><a href="fields.html">ฟอร์มสมัคร</a><a href="payment.html">PromptPay/ตรวจสลิป</a><a href="applicants.html">ผู้สมัคร</a></aside><section class="admin-main"><div class="admin-head"><div><h1>ตั้งค่างานและหน้าเว็บไซต์</h1><p class="muted">แก้ข้อมูลหน้าเว็บได้จากหน้านี้</p></div><button class="btn btn-dark" id="save">บันทึก</button></div><div id="adminMsg"></div><div class="card"><div class="form-grid"><div class="field"><label>ชื่องาน</label><input id="eventName"></div><div class="field"><label>ค่าสมัคร</label><input id="fee" type="number"></div><div class="field"><label>สถานะ</label><select id="status"><option value="draft">Draft</option><option value="open">เปิดรับสมัคร</option><option value="closed">ปิดรับสมัคร</option></select></div><div class="field"><label>วันจัดงาน</label><input id="eventDate" type="date"></div><div class="field full"><label>สถานที่</label><input id="venue"></div></div></div><div class="card" style="margin-top:16px"><h3>ข้อความหน้าเว็บ 4 ภาษา</h3><div id="langs"></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../js/app.js"></script><script src="js/admin.js"></script><script>(async()=>{if(!await ADMIN.guard())return;const e=await ADMIN.event();const langs=[['th','ไทย'],['en','English'],['zh','中文'],['ru','Русский']];document.querySelector('#eventName').value=e.event_name||'';document.querySelector('#fee').value=e.registration_fee||200;document.querySelector('#status').value=e.status;document.querySelector('#eventDate').value=e.event_date||'';document.querySelector('#venue').value=e.venue||'';document.querySelector('#langs').innerHTML=langs.map(([k,n])=>`<div class="form-section"><h3>${n}</h3><div class="form-grid"><div class="field full"><label>Hero title</label><input data-key="hero_title_i18n" data-lang="${k}" value="${APP.esc((e.hero_title_i18n||{})[k]||'')}"></div><div class="field full"><label>Hero subtitle</label><textarea data-key="hero_subtitle_i18n" data-lang="${k}">${APP.esc((e.hero_subtitle_i18n||{})[k]||'')}</textarea></div><div class="field full"><label>ข้อความชำระเงิน</label><textarea data-key="payment_note_i18n" data-lang="${k}">${APP.esc((e.payment_note_i18n||{})[k]||'')}</textarea></div><div class="field full"><label>ข้อความบนฟอร์ม</label><textarea data-key="form_intro_i18n" data-lang="${k}">${APP.esc((e.form_intro_i18n||{})[k]||'')}</textarea></div></div></div>`).join('');document.querySelector('#save').onclick=async()=>{const upd={event_name:document.querySelector('#eventName').value,registration_fee:Number(document.querySelector('#fee').value),status:document.querySelector('#status').value,event_date:document.querySelector('#eventDate').value||null,venue:document.querySelector('#venue').value};document.querySelectorAll('[data-key]').forEach(x=>{upd[x.dataset.key]=upd[x.dataset.key]||{};upd[x.dataset.key][x.dataset.lang]=x.value});const {error}=await sb.from('events').update(upd).eq('id',e.id);if(error)ADMIN.toast(error.message,'error');else ADMIN.toast('บันทึกแล้ว')};})();</script></body></html>
