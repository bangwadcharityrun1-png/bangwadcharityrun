<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><title>TOP100 Admin</title></head><body><header class="topbar"><div class="inner"><div class="brand">TOP100 ADMIN</div><div class="nav-actions"><a href="../index.html" target="_blank">ดูเว็บไซต์</a><button class="btn btn-light" id="logout">ออกจากระบบ</button></div></div></header><main class="container"><div class="admin-layout"><aside class="sidebar"><a href="index.html">Dashboard</a><a href="event.html">ตั้งค่างาน/หน้าเว็บ</a><a href="categories.html">ประเภทและรูปเสื้อ</a><a href="fields.html">ฟอร์มสมัคร</a><a href="payment.html">PromptPay/ตรวจสลิป</a><a href="applicants.html">ผู้สมัคร</a></aside><section class="admin-main"><div class="admin-head"><div><h1>Dashboard</h1><p class="muted">ภาพรวมระบบรับสมัคร</p></div></div><div id="adminMsg"></div><div class="grid2"><div class="card"><span class="muted">ผู้สมัครทั้งหมด</span><h2 id="total">-</h2></div><div class="card"><span class="muted">ชำระเงินผ่านการตรวจ</span><h2 id="verified">-</h2></div></div><div class="card" style="margin-top:16px"><h3>ล่าสุด</h3><div class="table-wrap"><table class="table"><thead><tr><th>ใบสมัคร</th><th>ชื่อ</th><th>ประเภท</th><th>สถานะ</th><th>วันที่</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../js/app.js"></script><script src="js/admin.js"></script><script>(async()=>{if(!await ADMIN.guard())return;const e=await ADMIN.event();const {data,error}=await sb.from('registrations').select('application_no,first_name,last_name,status,created_at,event_categories(code),payments(status)').eq('event_id',e.id).order('created_at',{ascending:false}).limit(100);if(error){ADMIN.toast(error.message,'error');return}document.querySelector('#total').textContent=data.length;document.querySelector('#verified').textContent=data.filter(x=>x.payments?.status==='verified').length;document.querySelector('#rows').innerHTML=data.slice(0,15).map(r=>`<tr><td>${APP.esc(r.application_no)}</td><td>${APP.esc(r.first_name+' '+r.last_name)}</td><td>${APP.esc(r.event_categories?.code||'')}</td><td><span class="pill ${r.status}">${r.status}</span></td><td>${new Date(r.created_at).toLocaleString('th-TH')}</td></tr>`).join('')})();</script></body></html>
