<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><title>TOP100 Admin</title></head><body><header class="topbar"><div class="inner"><div class="brand">TOP100 ADMIN</div><div class="nav-actions"><a href="../index.html" target="_blank">ดูเว็บไซต์</a><button class="btn btn-light" id="logout">ออกจากระบบ</button></div></div></header><main class="container"><div class="admin-layout"><aside class="sidebar"><a href="index.html">Dashboard</a><a href="event.html">ตั้งค่างาน/หน้าเว็บ</a><a href="categories.html">ประเภทและรูปเสื้อ</a><a href="fields.html">ฟอร์มสมัคร</a><a href="payment.html">PromptPay/ตรวจสลิป</a><a href="applicants.html">ผู้สมัคร</a></aside><section class="admin-main"><div class="admin-head"><div><h1>ประเภทและรูปเสื้อ</h1><p class="muted">เพิ่ม แก้ไข ลบ และอัปโหลดรูปเสื้อ</p></div><button class="btn btn-dark" id="add">+ เพิ่มประเภท</button></div><div id="adminMsg"></div><div id="list" class="grid2"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../js/app.js"></script><script src="js/admin.js"></script><script>(async()=>{if(!await ADMIN.guard())return;const e=await ADMIN.event();async function load(){const {data,error}=await sb.from('event_categories').select('*').eq('event_id',e.id).order('display_order');if(error)return ADMIN.toast(error.message,'error');document.querySelector('#list').innerHTML=data.map(c=>`<div class="card"><div class="field"><label>Code</label><input data-code="${c.id}" value="${APP.esc(c.code)}"></div><div class="form-grid"><div class="field"><label>ชื่อไทย</label><input data-name-th="${c.id}" value="${APP.esc((c.name_i18n||{}).th||'')}"></div><div class="field"><label>English</label><input data-name-en="${c.id}" value="${APP.esc((c.name_i18n||{}).en||'')}"></div><div class="field"><label>中文</label><input data-name-zh="${c.id}" value="${APP.esc((c.name_i18n||{}).zh||'')}"></div><div class="field"><label>Русский</label><input data-name-ru="${c.id}" value="${APP.esc((c.name_i18n||{}).ru||'')}"></div></div><div class="field"><label>คำอธิบายไทย</label><input data-desc-th="${c.id}" value="${APP.esc((c.description_i18n||{}).th||'')}"></div><div class="field"><label>รูปเสื้อ</label><input type="file" accept="image/*" data-file="${c.id}"></div>${c.shirt_image_url?`<img src="${APP.esc(c.shirt_image_url)}" style="width:100%;max-height:220px;object-fit:contain;margin-top:10px">`:''}<div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-dark" data-save="${c.id}">บันทึก</button><button class="btn btn-danger" data-del="${c.id}">ลบ</button></div></div>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save;let image=data.find(x=>x.id===id)?.shirt_image_url||null;const file=document.querySelector(`[data-file="${id}"]`).files[0];if(file){const path=`categories/${e.id}/${id}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('event-assets').upload(path,file,{upsert:true});if(up.error)return ADMIN.toast(up.error.message,'error');image=sb.storage.from('event-assets').getPublicUrl(path).data.publicUrl}const old=data.find(x=>x.id===id);const name={th:document.querySelector(`[data-name-th="${id}"]`).value,en:document.querySelector(`[data-name-en="${id}"]`).value,zh:document.querySelector(`[data-name-zh="${id}"]`).value,ru:document.querySelector(`[data-name-ru="${id}"]`).value};const desc={...(old.description_i18n||{}),th:document.querySelector(`[data-desc-th="${id}"]`).value};const {error}=await sb.from('event_categories').update({code:document.querySelector(`[data-code="${id}"]`).value.trim().toUpperCase(),name_i18n:name,description_i18n:desc,shirt_image_url:image}).eq('id',id);if(error)ADMIN.toast(error.message,'error');else{ADMIN.toast('บันทึกแล้ว');load()}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('ลบประเภทนี้?'))return;const {error}=await sb.from('event_categories').delete().eq('id',b.dataset.del);if(error)ADMIN.toast(error.message,'error');else load()})}document.querySelector('#add').onclick=async()=>{const code=prompt('Code เช่น TOP100MEN');if(!code)return;const {error}=await sb.from('event_categories').insert({event_id:e.id,code:code.trim().toUpperCase(),name_i18n:{th:code,en:code,zh:code,ru:code},display_order:99});if(error)ADMIN.toast(error.message,'error');else load()};load()})();</script></body></html>
